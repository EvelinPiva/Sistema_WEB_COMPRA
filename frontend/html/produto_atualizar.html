<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/style_cad.css">
    <link rel="shortcut icon" href="./carrinho.png" type="image/x-icon">
    <script src="../js/produto_atualizar.js" defer></script>
    <title>Atualizar Produto</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Home</a>&emsp;&emsp;
            <span class="titulo_menu">Produtos</span>&emsp;
            <a href="./produto_cadastrar.html">Cadastrar</a>&emsp;
            <a href="./produto_listar.html">Listar</a>&emsp;
            <a href="./produto.consultar.html">Consultar</a>&emsp;
            <a href="./produto_atualizar.html">Atualizar</a>&emsp;
            <a href="./produto_apagar.html">Apagar</a>
            <br><br><hr><br>
        </nav>
    </header>
    <main>
        <h2>Atualizar Produto</h2>
        <br>
        <label for="codigo_busca">Código do Produto</label><br>
        <input type="number" id="codigo_busca" required>
        <button id="btn_buscar">Buscar</button>
        <br><br>

        <form id="form_atualizar" style="display: none;">
            <input type="hidden" id="codProduto">

            <label for="nome">Nome</label><br>
            <input type="text" id="nome" required><br><br>

            <label for="descricao">Descrição</label><br>
            <input type="text" id="descricao"><br><br>

            <label for="categoria">Categoria</label><br>
            <input type="text" id="categoria" required><br><br>

            <label for="preco">Preço</label><br>
            <input type="number" step="0.01" id="preco" required><br><br>

            <label for="desconto">Desconto (%)</label><br>
            <input type="number" step="0.01" id="desconto"><br><br>

            <label for="qtdeEstoque">Quantidade em Estoque</label><br>
            <input type="number" id="qtdeEstoque" required><br><br>

            <label for="marca">Marca</label><br>
            <input type="text" id="marca"><br><br>

            <button id="btn_salvar">Salvar Alterações</button>
        </form>

        <br>
        <div id="resposta" class="resposta"></div>
    </main>
</body>
</html>
